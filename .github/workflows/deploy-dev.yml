# 指定したブランチを Vercel の dev（blueprint-*-dev。Supabase の dev に接続）へデプロイする。
# Git 連携は使わず、必要な時だけ手動で実行する（push・PR・マージでは動かない）。
# 手順・前提は scripts/vercel-env/README.md「Vercel の dev へのデプロイ」。
#
#   gh workflow run deploy-dev.yml -f ref=feature/20261015-dev -f student=true -f admin=true
name: Deploy to dev

on:
  workflow_dispatch:
    inputs:
      ref:
        description: デプロイするブランチ（例 feature/20261015-dev）
        required: true
        type: string
      admin:
        description: admin
        type: boolean
        default: false
      student:
        description: student
        type: boolean
        default: false
      coach:
        description: coach
        type: boolean
        default: false

permissions:
  contents: read

env:
  # gabbys-projects（scripts/vercel-env/environments.mjs の VERCEL_TEAM_ID）
  VERCEL_ORG_ID: team_GoIL7IhwYdKe0XLs4UVEZ4rh

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
    steps:
      - id: apps
        env:
          ADMIN: ${{ inputs.admin }}
          STUDENT: ${{ inputs.student }}
          COACH: ${{ inputs.coach }}
        run: |
          apps=()
          [ "$ADMIN" = "true" ] && apps+=('"admin"')
          [ "$STUDENT" = "true" ] && apps+=('"student"')
          [ "$COACH" = "true" ] && apps+=('"coach"')
          if [ ${#apps[@]} -eq 0 ]; then
            echo "::error::デプロイするアプリを1つ以上選んでください。"
            exit 1
          fi
          echo "apps=[$(IFS=,; echo "${apps[*]}")]" >> "$GITHUB_OUTPUT"

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.prepare.outputs.apps) }}
    # 同じアプリへのデプロイは1つずつ（後から実行した方が最後に反映される）
    concurrency:
      group: deploy-dev-${{ matrix.app }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve project
        id: project
        env:
          APP: ${{ matrix.app }}
        run: |
          case "$APP" in
            admin) id=prj_QsIkByBrgufMfDPpTc5XyPdGSPUV ;;
            student) id=prj_JaDvlbZFH1k4YVg1EWC5ReB0Tcma ;;
            coach) id=prj_lYTSawX7FjeOvDD1oplbQE0TW3zJ ;;
          esac
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "message=$(git log -1 --format=%s | head -c 200)" >> "$GITHUB_OUTPUT"

      # リポジトリ直下からアップロードし、ビルドは Vercel 側で行う（Root Directory 等はプロジェクトの設定に従う）
      - name: Deploy
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_BLUEPRINT_TOKEN }}
          VERCEL_PROJECT_ID: ${{ steps.project.outputs.id }}
          REF: ${{ inputs.ref }}
          SHA: ${{ steps.project.outputs.sha }}
          MESSAGE: ${{ steps.project.outputs.message }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::リポジトリの Secrets に VERCEL_BLUEPRINT_TOKEN がありません。"
            exit 1
          fi
          url=$(npx --yes vercel@50.33.0 deploy --prod --yes --token "$VERCEL_TOKEN" \
            -m githubCommitRef="$REF" -m githubCommitSha="$SHA" -m githubCommitMessage="$MESSAGE" \
            -m githubDeployedBy="$GITHUB_ACTOR")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Summary
        env:
          APP: ${{ matrix.app }}
          REF: ${{ inputs.ref }}
          SHA: ${{ steps.project.outputs.sha }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          {
            echo "### $APP → https://blueprint-$APP-dev.vercel.app"
            echo ""
            echo "| 項目 | 値 |"
            echo "|---|---|"
            echo "| ブランチ | \`$REF\` |"
            echo "| コミット | \`${SHA:0:8}\` |"
            echo "| デプロイ | $URL |"
            echo "| 実行者 | $GITHUB_ACTOR |"
          } >> "$GITHUB_STEP_SUMMARY"
