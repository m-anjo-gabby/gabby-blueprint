# 型チェック・lint・単体テストを、push と PR のたびに自動で実行する（手元の `pnpm check` と同じ内容）。
# デプロイ（deploy.yml）とは独立しており、ここが失敗してもデプロイは止まらない。
# 依存関係の更新（.github/dependabot.yml）の PR も、このワークフローの結果で取り込めるかを判断する。
name: CI

on:
  push:
    branches:
      - main
      - staging
      - "feature/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同じブランチで続けて push した場合は、古い実行を取り消す
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # pnpm の版は package.json の packageManager に従う
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test
