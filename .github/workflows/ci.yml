# 型チェック・lint・書式・単体テストを、push と PR のたびに自動で実行する（手元の `pnpm check` と同じ内容）。
# デプロイ（deploy.yml）は、出すコミットのこのワークフローの結果を確かめ、staging・本番では成功していなければ止まる。
# 依存関係の更新（.github/dependabot.yml）の PR も、このワークフローの結果で取り込めるかを判断する。
name: CI

on:
  push:
    branches:
      - main
      - staging
      - "feature/**"
  pull_request:
  workflow_dispatch:
  # push が無い週も流す（依存・実行環境の変化で落ちるものに早く気づく。例: Node の tzdata の更新）。対象は main
  schedule:
    - cron: "0 0 * * 1" # 毎週月曜 09:00（日本時間）

permissions:
  contents: read

# 同じブランチで続けて push した場合は、古い実行を取り消す
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # pnpm の版は package.json の packageManager に従う
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test

      # 単体テストの対象になる処理のうち、テストの無いファイルを結果の画面に出す（失敗にはしない。testing/unit/README.md）
      - name: Unit test coverage
        run: pnpm --filter @gabby/testing unit:coverage-summary
